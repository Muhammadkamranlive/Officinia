  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/env/.env.enc
    - .env
    - assets/icons/
    - assets/images/
    - assets/icon_Images/
    - assets/gif/
    - assets/json/
    - assets/form_data.json
    - assets/images/process_timeline/
    - assets/images/backgroung_image/Login.png
    - assets/certificates/abcFBLL.crt

    # An image asset can refer to one or more resolution-specific "variants", see
    # https://flutter.dev/assets-and-images/#resolution-aware

    # For details regarding adding assets from package dependencies, see
    # https://flutter.dev/assets-and-images/#from-packages

    # To add custom fonts to your application, add a fonts section here,
    # in this "flutter" section. Each entry in this list should have a
    # "family" key with the font family name, and a "fonts" key with a
    # list giving the asset and other descriptors for the font. For
    # example:
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto_Fonts/Roboto-Black.ttf
        - asset: assets/fonts/Roboto_Fonts/Roboto-BlackItalic.ttf
        - asset: assets/fonts/Roboto_Fonts/Roboto-Bold.ttf
        - asset: assets/fonts/Roboto_Fonts/Roboto-BoldItalic.ttf
        - asset: assets/fonts/Roboto_Fonts/Roboto-Medium.ttf
        - asset: assets/fonts/Roboto_Fonts/Roboto-MediumItalic.ttf
        - asset: assets/fonts/Roboto_Fonts/Roboto-Regular.ttf
    - family: poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins/Poppins-Black.ttf
        - asset: assets/fonts/poppins/Poppins/Poppins-Bold.ttf
        - asset: assets/fonts/poppins/Poppins/Poppins-Regular.ttf
        - asset: assets/fonts/poppins/Poppins/Poppins-Medium.ttf
        
